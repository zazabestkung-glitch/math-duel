<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Duel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef3ff;
      color: #202943;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(500px, 92%);
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0002;
    }
    h1, .center { text-align: center; }
    input, select, button {
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      font: inherit;
    }
    input, select { border: 1px solid #bbc4d8; }
    button {
      margin: 4px;
      border: 0;
      background: #4d5fe8;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .scores { display: flex; justify-content: space-around; margin: 20px 0; }
    .score { padding: 12px; border-radius: 12px; background: #f1f3fa; }
    #question { margin: 24px 0; font-size: 2.8rem; font-weight: bold; }
    #answer { width: 140px; text-align: center; font-size: 1.3rem; }
    #status, #gameStatus, #result { min-height: 28px; text-align: center; }
    #status.error, .error { color: #b42318; }
    #game { display: none; }
    #roomLabel { font-weight: bold; letter-spacing: 2px; }
    .field { margin: 14px 0; }
    .field label { display: block; margin-bottom: 7px; font-weight: bold; }
    #difficultyHelp { color: #59647b; line-height: 1.4; }
    #timer { font-size: 1.2rem; font-weight: bold; color: #4659e8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Math Duel</h1>

  <section id="lobby">
    <p class="center">Two players, two devices, the same question.</p>

    <div class="field center">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" value="Player">
    </div>

    <div class="field">
      <label for="difficulty">Host: choose the difficulty</label>
      <select id="difficulty">
        <option value="warmup">Warm-up</option>
        <option value="grade3" selected>Normal</option>
        <option value="stretch">Hard</option>
      </select>
      <p id="difficultyHelp">
        Add and subtract within 100; multiplication and division facts up to 10.
      </p>
    </div>

    <div class="row">
      <button id="create">Create a game</button>
    </div>

    <p class="center">Or join a game:</p>
    <div class="row">
      <input id="joinCode" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">
      <button id="join">Join</button>
    </div>

    <p id="status" class="center">Create a room or enter a room code.</p>
  </section>

  <section id="game">
    <p class="center">Room code: <span id="roomLabel"></span></p>
    <p class="center" id="difficultyLabel"></p>

    <div class="scores">
      <div class="score"><span id="p1name"></span>: <strong id="p1score">0</strong></div>
      <div class="score"><span id="p2name"></span>: <strong id="p2score">0</strong></div>
    </div>

    <p id="roundLabel" class="center"></p>
    <div id="question" class="center">Waiting…</div>
    <p id="timer" class="center"></p>

    <div class="row">
      <input id="answer" type="number" step="1" placeholder="Answer" disabled>
      <button id="submit" disabled>Submit</button>
    </div>

    <p id="gameStatus" class="center"></p>
    <p id="result" class="center"></p>

    <div class="row">
      <button id="nextRound" hidden>Next question</button>
      <button id="playAgain" hidden>Play again</button>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const API = "/.netlify/functions/game";

  const difficultyNames = {
    warmup: "Warm-up",
    grade3: "Grade 3 Challenge",
    stretch: "Stretch"
  };

  let roomCode = "";
  let token = "";
  let role = "";
  let pollId = null;
  let busy = false;
  let refreshing = false;

  async function callApi(action, extra = {}) {
    const response = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, code: roomCode, token, role, ...extra })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
    return data;
  }

  function nameValue(fallback) {
    return $("name").value.trim() || fallback;
  }

  function showLobbyError(error) {
    $("status").textContent = error.message;
    $("status").classList.add("error");
  }

  async function createGame() {
    try {
      $("status").classList.remove("error");
      $("status").textContent = "Creating room…";

      const data = await callApi("create", {
        name: nameValue("Player 1"),
        difficulty: $("difficulty").value
      });

      enterRoom(data);
    } catch (error) {
      showLobbyError(error);
    }
  }

  async function joinGame() {
    try {
      $("status").classList.remove("error");
      $("status").textContent = "Joining room…";

      const data = await callApi("join", {
        code: $("joinCode").value.trim().toUpperCase(),
        name: nameValue("Player 2")
      });

      enterRoom(data);
    } catch (error) {
      showLobbyError(error);
    }
  }

  function enterRoom(data) {
    roomCode = data.code;
    token = data.token;
    role = data.role;

    $("lobby").style.display = "none";
    $("game").style.display = "block";
    $("roomLabel").textContent = roomCode;

    refresh();
    pollId = setInterval(refresh, 1000);
  }

  async function refresh() {
    if (refreshing || !roomCode) return;
    refreshing = true;

    try {
      const state = await callApi("state");
      render(state);
    } catch (error) {
      $("gameStatus").textContent = error.message;
    } finally {
      refreshing = false;
    }
  }

  function render(state) {
    $("p1name").textContent = state.players.p1 || "Player 1";
    $("p2name").textContent = state.players.p2 || "Waiting";
    $("p1score").textContent = state.displayScores.p1;
    $("p2score").textContent = state.displayScores.p2;
    $("difficultyLabel").textContent =
      `Difficulty: ${difficultyNames[state.difficulty] || state.difficulty}`;

    $("nextRound").hidden = true;
    $("playAgain").hidden = true;
    $("result").textContent = "";

    if (state.state === "waiting") {
      $("roundLabel").textContent = "";
      $("question").textContent = "Waiting for Player 2…";
      $("timer").textContent = "";
      $("gameStatus").textContent = "Share the room code with the other player.";
      $("answer").disabled = true;
      $("submit").disabled = true;
      return;
    }

    $("roundLabel").textContent = `Question ${state.roundNumber}`;
    $("question").textContent = state.round.text;
    $("timer").textContent = state.roundResult
      ? "Time is up or both players have answered."
      : `Time left: ${state.timeLeft} seconds`;

    if (state.roundResult) {
      $("result").textContent =
        `Answer: ${state.round.answer}. ` +
        `${state.players.p1}: ${state.roundResult.p1Correct ? "correct" : "not quite"}; ` +
        `${state.players.p2}: ${state.roundResult.p2Correct ? "correct" : "not quite"}.`;

      $("answer").disabled = true;
      $("submit").disabled = true;

      if (state.state === "finished") {
        const winner = state.scores.p1 === state.scores.p2
          ? "It's a tie!"
          : state.scores.p1 > state.scores.p2
            ? `${state.players.p1} wins!`
            : `${state.players.p2} wins!`;

        $("gameStatus").textContent = winner;
        if (role === "p1") $("playAgain").hidden = false;
      } else {
        $("gameStatus").textContent = "Round complete.";
        if (role === "p1") $("nextRound").hidden = false;
      }
      return;
    }

    const submitted = state.submitted;
    $("answer").disabled = submitted;
    $("submit").disabled = submitted;
    $("gameStatus").textContent = submitted
      ? "Answer submitted. Waiting for the other player…"
      : "Enter your answer.";
  }

  async function submitAnswer() {
    if ($("answer").value.trim() === "") {
      $("gameStatus").textContent = "Type an answer first.";
      return;
    }

    const value = Number($("answer").value);
    if (!Number.isInteger(value)) {
      $("gameStatus").textContent = "Please enter a whole number.";
      return;
    }

    busy = true;
    $("submit").disabled = true;

    try {
      await callApi("submit", { answer: value });
      $("answer").value = "";
    } catch (error) {
      $("gameStatus").textContent = error.message;
    } finally {
      busy = false;
      $("submit").disabled = false;
    }

    await refresh();
  }

  async function nextRound() {
    try {
      await callApi("advance");
      await refresh();
    } catch (error) {
      $("gameStatus").textContent = error.message;
    }
  }

  async function playAgain() {
    try {
      await callApi("restart");
      await refresh();
    } catch (error) {
      $("gameStatus").textContent = error.message;
    }
  }

  $("difficulty").addEventListener("change", () => {
    const help = {
      warmup: "Addition and subtraction within 20; easier multiplication and exact division facts.",
      grade3: "Add and subtract within 100; multiplication and division facts up to 10.",
      stretch: "Larger addition and subtraction; multiplication and division facts up to 12."
    };
    $("difficultyHelp").textContent = help[$("difficulty").value];
  });

  $("create").addEventListener("click", createGame);
  $("join").addEventListener("click", joinGame);
  $("submit").addEventListener("click", () => {
    if (!busy) submitAnswer();
  });
  $("answer").addEventListener("keydown", event => {
    if (event.key === "Enter" && !$("submit").disabled) submitAnswer();
  });
  $("nextRound").addEventListener("click", nextRound);
  $("playAgain").addEventListener("click", playAgain);
</script>
</body>
</html>
